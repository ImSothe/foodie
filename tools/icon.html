<!doctype html>
<!-- Source of the app icon. The artwork is tools/icon-source.jpg: a picture generated with Google's Gemini (app, Google AI Pro account of the
     author, 13 Nov 2026) from the prompt "calorie and macro tracking app icon, bitten burger with lettuce, near-black background with a faint
     green glow", cropped inside its rounded corners. tools/make_icons.py opens this page in headless Chrome and saves the image the page
     leaves in <body data-png>.
     ?size=192  output size in px   ?pad=1  maskable safe zone (artwork at 80 %)   ?type=webp  encode as WebP instead of PNG -->
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; background: #050806; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  (function () {
    const q = new URLSearchParams(location.search);
    const size = Number(q.get('size')) || 512;
    const type = q.get('type') === 'webp' ? 'image/webp' : 'image/png';
    const c = document.getElementById('c');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const img = new Image();
    img.onload = () => {
      // Edge colour of the artwork, so the padding of the maskable version blends in instead of showing a frame.
      const probe = document.createElement('canvas');
      probe.width = probe.height = 8;
      const p = probe.getContext('2d');
      p.drawImage(img, 0, 0, 8, 8);
      const px = p.getImageData(0, 0, 1, 1).data;
      x.fillStyle = `rgb(${px[0]}, ${px[1]}, ${px[2]})`;
      x.fillRect(0, 0, size, size);
      const k = q.has('pad') ? 0.8 : 1;
      const side = size * k;
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, (size - side) / 2, (size - side) / 2, side, side);
      document.body.dataset.png = c.toDataURL(type, 0.9);
    };
    img.src = 'icon-source.jpg';
  })();
</script>
</body>
</html>
