<!doctype html>
<!-- Source of the app icon: a burger built from the three macros (saffron bun = carbohydrates, salmon patty =
     protein, blueberry layer = fat) with one bite taken. tools/make_icons.py opens this page in headless Chrome
     and saves the PNG the page leaves in <body data-png>.   ?size=192  output size in px   ?pad=1  maskable safe zone -->
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; background: #0A0A0C; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  (function () {
    const q = new URLSearchParams(location.search);
    const size = Number(q.get('size')) || 512;
    const c = document.getElementById('c');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#0A0A0C';
    x.fillRect(0, 0, size, size);

    // The burger is drawn on its own layer (512 px design grid) so the bite can cut through every layer at once.
    const layer = document.createElement('canvas');
    layer.width = layer.height = 512;
    const b = layer.getContext('2d');
    const CARBS = '#F5B83D', PROTEIN = '#FF6B6B', FAT = '#7AA2FF';
    const bar = (color, left, top, width, height, radii) => {
      b.fillStyle = color;
      b.beginPath();
      b.roundRect(left, top, width, height, radii);
      b.fill();
    };
    b.translate(0, -18);
    b.fillStyle = CARBS;                       // top bun
    b.beginPath();
    b.ellipse(256, 232, 148, 124, 0, Math.PI, 0);
    b.closePath();
    b.fill();
    bar(FAT, 88, 256, 336, 30, 15);
    bar(PROTEIN, 104, 306, 304, 54, 27);
    bar(CARBS, 112, 380, 288, 60, [8, 8, 44, 44]);   // bottom bun

    b.globalCompositeOperation = 'destination-out';  // the bite, top right
    for (const [cx, cy, r] of [[404, 150, 54], [440, 214, 40], [352, 108, 30]]) {
      b.beginPath();
      b.arc(cx, cy, r, 0, Math.PI * 2);
      b.fill();
    }

    const k = (size / 512) * (q.has('pad') ? 0.78 : 1);
    x.translate(size / 2, size / 2);
    x.scale(k, k);
    x.drawImage(layer, -256, -256);
    document.body.dataset.png = c.toDataURL('image/png');
  })();
</script>
</body>
</html>
