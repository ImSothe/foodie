name: CI
on: [push, pull_request]
permissions:
  contents: read            # CI only reads the code: it cannot write or publish anything
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
  # Runs firestore.rules against the real Firestore emulator. Separate from `test` on purpose: it needs Java and about 460 MB of
  # dev tooling (tests/rules/), and the Pages deploy (pages.yml) neither waits for it nor depends on it.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ hashFiles('tests/rules/package-lock.json') }}   # the emulator version is chosen by the pinned firebase-tools
      - run: npm ci --prefix tests/rules
      - run: npm run test:rules
